<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudyOS</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
  <link rel="stylesheet" href="/css/tasks.css" />
  <link rel="stylesheet" href="/css/courses.css" />
  <link rel="stylesheet" href="/css/calendar.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <h1>StudyOS</h1>
      <button data-view="today">Today</button>
      <button data-view="weekly">Weekly</button>
      <button data-view="tasks">Tasks</button>
      <button data-view="courses">Courses</button>
      <button data-view="lectures">Lectures</button>
      <button data-view="labs">Labs</button>
      <button data-view="timetable">Timetable</button>
      <button data-view="calendar">Calendar</button>
      <button data-view="search">Search</button>
      <button data-view="inbox">Inbox</button>
      <button data-view="study">Study Sessions</button>
      <button id="quick-add-open" class="primary">+ Quick Add</button>
    </aside>

    <main class="content">
      <header class="topbar">
        <div>
          <h2 id="view-title">Today</h2>
          <p id="status">Connecting...</p>
        </div>
        <button id="refresh-btn">Refresh</button>
      </header>
      <section id="view-root"></section>
    </main>
  </div>

  <dialog id="lecture-capture-modal" class="modal"></dialog>
  <dialog id="lecture-review-modal" class="modal"></dialog>
  <dialog id="quick-add-modal" class="modal"></dialog>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
