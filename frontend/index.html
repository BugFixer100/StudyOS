<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudyOS</title>
    <link rel="stylesheet" href="/css/style.css?v=studyos-notifications-2" />
    <link rel="stylesheet" href="/css/dashboard.css?v=studyos-prep-ui-4" />
    <link rel="stylesheet" href="/css/tasks.css?v=studyos-prep-ui-4" />
    <link rel="stylesheet" href="/css/courses.css?v=studyos-health-ui-2" />
    <link rel="stylesheet" href="/css/calendar.css?v=studyos-schedule-ui-2" />
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <a class="brand" href="#" aria-label="StudyOS home"
          >Study<span>OS</span></a
        >
        <div class="header-actions">
          <button
            class="icon-button notification-button"
            aria-label="Notifications"
            aria-expanded="false"
          >
            ♧<span id="notification-count">0</span>
          </button>
          <button class="icon-button" aria-label="Search" data-view="search">
            ⌕
          </button>
          <span class="header-divider"></span>
          <button class="profile-button" aria-label="Student profile">
            Fida <span class="avatar">F</span>
          </button>
        </div>
        <div id="notification-panel" class="notification-panel" hidden></div>
      </header>
      <aside class="sidebar">
        <nav aria-label="Main navigation">
          <button data-view="today"><span>🏠</span>Today</button>
          <button data-view="calendar"><span>🗓️</span>Calendar</button>
          <button data-view="courses"><span>📚</span>Courses</button>
          <button data-view="tasks"><span>✅</span>Tasks</button>
          <button data-view="lectures"><span>🧠</span>Lectures</button>
          <button data-view="labs"><span>🧪</span>Labs</button>
          <button data-view="timetable"><span>🕐</span>Timetable</button>
          <button data-view="inbox"><span>📥</span>Inbox</button>
          <button data-view="study"><span>🎯</span>Study</button>
          <button data-view="weekly"><span>📊</span>Weekly</button>
        </nav>
        <button id="quick-add-open" class="primary">＋ Quick Add</button>
      </aside>

      <main class="content">
        <header class="topbar">
          <div>
            <h2 id="view-title">Today</h2>
            <p id="status">Connecting...</p>
          </div>
          <button id="refresh-btn" aria-label="Refresh data">↻ Refresh</button>
        </header>
        <section id="view-root"></section>
      </main>
    </div>

    <dialog id="lecture-capture-modal" class="modal"></dialog>
    <dialog id="lecture-review-modal" class="modal"></dialog>
    <dialog id="quick-add-modal" class="modal"></dialog>

    <script type="module" src="/js/app.js?v=studyos-notifications-2"></script>
  </body>
</html>
